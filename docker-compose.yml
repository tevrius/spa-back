name: warehouse-ai

x-app: &app
  build:
    context: .
    target: runtime
  environment: &environment
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://warehouse:warehouse_demo@db:5432/warehouse}
    APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
    EXPIRY_WARNING_DAYS: ${EXPIRY_WARNING_DAYS:-30}
    INACTIVITY_DAYS: ${INACTIVITY_DAYS:-90}
    SEED_DEMO: ${SEED_DEMO:-true}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse_demo}
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  init:
    <<: *app
    command: ["python", "-m", "scripts.bootstrap"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 15

  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: warehouse_test
      POSTGRES_USER: warehouse_test
      POSTGRES_PASSWORD: warehouse_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_test -d warehouse_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://warehouse_test:warehouse_test@test-db:5432/warehouse_test
      TEST_DATABASE_URL: postgresql+psycopg://warehouse_test:warehouse_test@test-db:5432/warehouse_test
      SEED_DEMO: "false"
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  warehouse-data:
